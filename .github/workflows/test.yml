name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fish
        run: sudo apt-get update && sudo apt-get install -y fish ripgrep

      - name: Shellcheck
        # continue-on-error until the existing backlog of warnings is cleaned up;
        # flip to blocking once `shellcheck $(git ls-files '*.sh')` is clean locally.
        run: shellcheck $(git ls-files '*.sh')
        continue-on-error: true

      - name: Run dotfiles tests
        run: bash tests/run.sh
