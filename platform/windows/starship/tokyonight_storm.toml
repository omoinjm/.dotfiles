# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = false

# Set 'foo' as custom color palette
# palette = "foo"

# # # Define custom colors
# [palettes.foo]

# # Overwrite existing color
# purple = "#7aa2f7"
# blue = "#7dcfff"
# grey = "#a0a9cb"  
# cyan = "#67696B"
# green = "#9ece6a"
# red = "#f7768e"
# magenta = "bb9af7"

continuation_prompt = '[➜ ](fg:#7aa2f7 bg:transparent) '

command_timeout = 5000

format = """
[➜ ](fg:#7aa2f7 bg:transparent)\
$directory\
(${custom.git_branch}${custom.git_status}${custom.git_metrics}${custom.github})\
    $fill\
    $nodejs\
    $c\
    $rust\
    $golang\
    $java\
    $php\
    $dotnet\
    $docker_context\
    $time\
\n$shell \
"""

[character]
success_symbol = '[➜](fg:#7aa2f7)'
disabled = true

[fill]
symbol=" "
disabled = false

[memory_usage]
disabled = true
symbol = " "
threshold = -1
format = " [$symbol$ram](#656555)"

[username]
show_always = false
format = "[$user](#656555)"

[hostname]
ssh_only = false
format = "[$hostname](#656555)"
disabled = true

[time]
disabled = false
time_format = "%R" # Hour:Minute Format
style = "bg:transparent"
format = '[[  $time ](fg:#a0a9cb bg:#transparent)]($style)'

[directory]
style = "fg:#bb9af7"
format = "[$path]($style)"
truncation_length = 1

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[package]
symbol =" "
display_private = false
version_format = "v${raw}"
format = "[$symbol$version](#67696B)"

[shell]
powershell_indicator = "_ "
fish_indicator = "🐟"
cmd_indicator = "_"
bash_indicator = ""
zsh_indicator = ""
disabled = false
style = "fg:#9ece6a"
format = "[$indicator]($style)"

#=== git ===
# Built-in git modules use libgit2 and fail on WSL UNC paths from Windows
# PowerShell. Custom modules below shell out to git/gh instead.

[git_branch]
disabled = true

[git_state]
disabled = true

[git_status]
disabled = true
use_git_executable = true

[git_metrics]
disabled = true

[custom.git_branch]
description = "Current git branch via git CLI (WSL-safe)"
shell = ["pwsh.exe", "-NoProfile", "-Command", "-"]
detect_folders = [".git"]
command = '''
$b = git branch --show-current 2>$null
if (-not $b) { $b = git rev-parse --short HEAD 2>$null }
$u = git rev-parse --abbrev-ref "@{u}" 2>$null
if ($u -and $u -ne "@{u}") { "$b`:$u" } elseif ($b) { $b }
'''
format = ' [[  $output ](fg:#7dcfff bg:transparent)]($style)'
style = "fg:#7dcfff bg:transparent"
ignore_timeout = true

[custom.git_status]
description = "Working tree and upstream status via git CLI (WSL-safe)"
shell = ["pwsh.exe", "-NoProfile", "-Command", "-"]
detect_folders = [".git"]
command = '''
$p = @(git status --porcelain 2>$null)
$s = @()
if ($p.Count -gt 0) {
  $staged = @($p | Where-Object { $_ -match '^[MADRCU]' }).Count
  $modified = @($p | Where-Object { $_ -match '^.[MADRCU]' -and $_ -notmatch '^\?\?' }).Count
  $untracked = @($p | Where-Object { $_ -match '^\?\?' }).Count
  if ($staged -gt 0) { $s += [char]0x26A1 + " $staged" }
  if ($modified -gt 0) { $s += "?($modified)" }
  if ($untracked -gt 0) { $s += "~$untracked" }
}
$ab = git rev-list --left-right --count '@{u}...HEAD' 2>$null
if ($ab -match '^(\d+)\s+(\d+)') {
  $beh = [int]$matches[1]; $ahead = [int]$matches[2]
  if ($ahead -gt 0 -and $beh -gt 0) { $s += "⇕$ahead $beh" }
  elseif ($ahead -gt 0) { $s += "⇡$ahead" }
  elseif ($beh -gt 0) { $s += "⇣$beh" }
}
if ($s.Count -gt 0) { $s -join ' ' }
'''
format = ' [[  $output ](fg:#f7768e bg:transparent)]($style)'
style = "fg:#f7768e bg:transparent"
ignore_timeout = true

[custom.git_metrics]
description = "Line diff stats via git CLI (WSL-safe)"
shell = ["pwsh.exe", "-NoProfile", "-Command", "-"]
detect_folders = [".git"]
command = '''
$added = 0; $deleted = 0
foreach ($line in @((git diff --numstat 2>$null)) + @((git diff --cached --numstat 2>$null))) {
  if ($line -match '^(\d+)\s+(\d+)') {
    $added += [int]$matches[1]
    $deleted += [int]$matches[2]
  }
}
if ($added -gt 0 -or $deleted -gt 0) { "(+$added/-$deleted)" }
'''
format = ' [[ $output ](fg:#9ece6a bg:transparent)]($style)'
style = "fg:#9ece6a bg:transparent"
ignore_timeout = true

[custom.github]
description = "GitHub repo slug; adds PR number when one exists"
shell = ["pwsh.exe", "-NoProfile", "-Command", "-"]
detect_folders = [".git"]
command = '''
$remote = git remote get-url origin 2>$null
if ($remote -match 'github[^/:]*[:/](?<owner>[^/]+)/(?<repo>[^/.]+)') {
  $out = "$($matches.owner)/$($matches.repo -replace '\.git$','')"
} elseif ($remote) {
  $out = ($remote -replace '\.git$','')
} else {
  $out = Split-Path (git rev-parse --show-toplevel 2>$null) -Leaf
}
try {
  $pr = gh pr view --json number -q .number 2>$null
  if ($pr) { $out += " #$pr" }
} catch {}
$out
'''
format = ' [[  $output ](fg:#bb9af7 bg:transparent)]($style)'
style = "fg:#bb9af7 bg:transparent"
ignore_timeout = true

#=== cloud ===
[azure]
disabled = false
format = 'on [$symbol($subscription)]($style) '
symbol = '󰠅 '

[aws]
format = 'on [$symbol($profile )(\($region\) )]($style)'
symbol = '  '
[aws.region_aliases]
ap-southeast-2 = 'au'
us-east-1 = 'va'
[aws.profile_aliases]
CompanyGroupFrobozzOnCallAccess = 'Frobozz'


