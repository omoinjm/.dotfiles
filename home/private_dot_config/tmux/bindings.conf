# vim: ft=tmux
# Sourced after tpm so these win over plugin bindings (tmux-pain-control).

# Reload settings
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded!"

# Open the current pane's directory in the desktop file manager
bind o run-shell "cd '#{pane_current_path}' && if command -v open >/dev/null; then open .; elif command -v explorer.exe >/dev/null; then explorer.exe . || true; else xdg-open .; fi"

# Kill every pane except the current one
bind -r e kill-pane -a

# Move the current window left / right (no prefix)
bind-key -n C-S-Left swap-window -t -1 \; previous-window
bind-key -n C-S-Right swap-window -t +1 \; next-window

# Split in the current pane's directory and keep panes evenly sized
bind | split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind % split-window -h -c "#{pane_current_path}" \; select-layout even-horizontal
bind - split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
bind '"' split-window -v -c "#{pane_current_path}" \; select-layout even-vertical
