set -g default-terminal "xterm-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Undercurl + coloured underlines (nvim diagnostics, spell)
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

# default shell
set-option -g default-shell /usr/bin/fish

# Mouse scroll on
set -g mouse on

# action key
unbind C-b
set-option -g prefix C-t
set-option -g repeat-time 0
set-option -g focus-events on

#### basic settings

set-option -g status-justify "left"
set-window-option -g mode-keys vi
# look'n feel (statusline.conf overrides status bar colors)
set -g pane-active-border-style fg=colour166,bg=default
set -g window-style fg=colour10,bg=default
set -g window-active-style fg=colour12,bg=default
set-option -g history-limit 2051072

set -sg escape-time 10

# OSC 52 clipboard (copy-mode yanks reach the system clipboard, also over SSH)
set -g set-clipboard on
# let apps inside tmux send escape sequences straight to the terminal (images, OSC 52 from nvim)
set -g allow-passthrough on
# no gaps in window numbers after closing one
set -g renumber-windows on

# allow the title bar to adapt to whatever host you connect to
set -g set-titles on
set -g set-titles-string "#T"

# import
if-shell "uname -s | grep -q Darwin" "source ~/.config/tmux/macos.conf"

source ~/.config/tmux/theme.conf
source ~/.config/tmux/statusline.conf
source ~/.config/tmux/utility.conf

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-pain-control'
set -g @plugin 'craftzdog/tmux-claude-session-manager'
run '~/.config/tmux/plugins/tpm/tpm'

# after tpm, so these override plugin defaults
source ~/.config/tmux/bindings.conf

# machine-local overrides (not tracked)
source -q ~/.config/tmux/tmux-private.conf
